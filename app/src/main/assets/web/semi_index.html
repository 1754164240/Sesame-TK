<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sesame Config - Semi Design</title>
    <!-- 引入 Semi Design CSS -->
    <link rel="stylesheet" href="./css/semi.min.css" />
    <style>
        body {
            background-color: var(--semi-color-bg-0);
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--semi-color-bg-1);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            padding-bottom: 40px;
        }

        .header {
            padding: 16px;
            background: var(--semi-color-bg-2);
            border-bottom: 1px solid var(--semi-color-border);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.8);
        }

        body[theme-mode='dark'] .header {
            background-color: rgba(22, 22, 26, 0.8);
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--semi-color-border);
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--semi-color-text-0);
            flex: 1;
            padding-right: 12px;
        }

        .field-control {
            flex-shrink: 0;
            max-width: 60%;
        }

        .section-padding {
            padding: 0 16px;
        }

        /* 列表弹窗样式 */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--semi-color-border);
        }

        .list-item-left {
            display: flex;
            align-items: center;
            flex: 1;
            overflow: hidden;
        }

        .list-item-name {
            margin-left: 10px;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--semi-color-text-0);
        }

        .list-item-text {
            min-width: 0;
            margin-left: 10px;
        }

        .list-item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .safe-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--semi-color-fill-1);
            color: var(--semi-color-text-2);
            font-size: 11px;
            line-height: 16px;
        }

        .time-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .time-row.time-point {
            grid-template-columns: minmax(0, 1fr) auto;
        }

        .preview-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 0;
        }

        .preview-metric {
            padding: 8px;
            border: 1px solid var(--semi-color-border);
            border-radius: 6px;
            text-align: center;
            color: var(--semi-color-text-1);
            font-size: 12px;
        }

        .list-count-input {
            width: 80px;
            margin-left: 10px;
        }

        .sheet-footer {
            display: flex;
            justify-content: flex-end;
            padding-top: 16px;
            border-top: 1px solid var(--semi-color-border);
        }
    </style>

    <!-- React & ReactDOM -->
    <script src="./js/react.development.js"></script>
    <script src="./js/react-dom.development.js"></script>
    <!-- Semi UI JS -->
    <script src="./js/semi-ui.min.js"></script>
    <!-- Semi Icons -->
    <script src="./js/semi-icons.min.js"></script>
    <!-- Babel -->
    <script src="./js/babel.min.js"></script>
</head>

<body>
    <div id="app"></div>

    <script type="text/babel">
        const switchMode = () => {
            const body = document.body;
            if (body.hasAttribute('theme-mode')) {
                body.removeAttribute('theme-mode');
                window.setMode('light');
            } else {
                body.setAttribute('theme-mode', 'dark');
                window.setMode('dark');
            }
        };
        const { useState, useEffect, useMemo, useRef } = React;
        const { Collapse, Switch, Input, RadioGroup, Radio, Button, Toast, SideSheet, Checkbox, InputNumber, Typography } = SemiUI;
        const { IconSearch } = SemiIcons;
        const { Title, Text } = Typography;

        // --- Mock Data Wrappers ---
        const getTabsData = () => {
            try { return JSON.parse(window.HOOK.getTabs()); } catch (e) { return []; }
        };

        const getModelData = (code) => {
            try { return JSON.parse(window.HOOK.getModel(code)); } catch (e) { return []; }
        };

        const getFieldData = (modelCode, fieldCode) => {
            try {
                return JSON.parse(window.HOOK.getListMetadata(modelCode, fieldCode)) || [];
            } catch (e) {
                return [];
            }
        };

        const previewFriendScope = (selection) => {
            try {
                if (!window.HOOK || !window.HOOK.previewFriendScope) return null;
                return JSON.parse(window.HOOK.previewFriendScope(JSON.stringify(selection)));
            } catch (e) {
                return null;
            }
        };

        // --- Main Component ---
        const App = () => {

            // 1. 处理主题自动切换逻辑
            const applyTheme = () => {
                let isDark = false;
                if (window.HOOK && window.HOOK.isNightMode) {
                    try { isDark = window.HOOK.isNightMode(); } catch (e) { }
                } else {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
                }
                const body = document.body;
                if (isDark) {
                    body.setAttribute('theme-mode', 'dark');
                    if (window.setMode) window.setMode('dark');
                } else {
                    if (body.hasAttribute('theme-mode')) body.removeAttribute('theme-mode');
                    if (window.setMode) window.setMode('light');
                }
            };
            applyTheme();

            const [tabs, setTabs] = useState([]);
            const [modelsMap, setModelsMap] = useState({});
            const modelsMapRef = useRef({});
            const pendingModelsRef = useRef(new Set());

            // 列表弹窗相关的 State
            const [sheetVisible, setSheetVisible] = useState(false);
            const [sheetConfig, setSheetConfig] = useState({ modelCode: '', fieldCode: '', type: '', title: '', desc: '' });
            const [sheetList, setSheetList] = useState([]); // 完整列表数据
            const [sheetSearch, setSheetSearch] = useState(''); // 搜索关键词
            const [selectedIds, setSelectedIds] = useState(new Set()); // 选中的ID集合
            const [selectedCounts, setSelectedCounts] = useState({}); // ID对应的数值
            const selectedIdsRef = useRef(new Set());
            const selectedCountsRef = useRef({});
            const [sheetTagFilters, setSheetTagFilters] = useState(new Set());
            const [selectedFriendPreview, setSelectedFriendPreview] = useState(null);
            const [allFriendPreview, setAllFriendPreview] = useState(null);

            // 时间抽屉相关的 State
            const [timeSheetVisible, setTimeSheetVisible] = useState(false);
            const [timeSheetConfig, setTimeSheetConfig] = useState({
                modelCode: '',
                fieldCode: '',
                editorType: '',
                title: '',
                defaultConfigValue: ''
            });
            const [timeValues, setTimeValues] = useState([]);
            const timeValuesRef = useRef([]);
            const [timeDisabled, setTimeDisabled] = useState(false);
            const timeDisabledRef = useRef(false);

            // 初始化
            useEffect(() => {
                const tabsData = getTabsData();
                setTabs(tabsData);
                const initialMap = {};
                tabsData.forEach(tab => {
                    initialMap[tab.modelCode] = getModelData(tab.modelCode);
                });
                modelsMapRef.current = initialMap;
                setModelsMap(initialMap);
            }, []);

            const handleFieldChange = (modelCode, fieldCode, newValue) => {
                const currentFields = [...(modelsMapRef.current[modelCode] || [])];
                const fieldIndex = currentFields.findIndex(f => f.code === fieldCode);
                if (fieldIndex < 0) return;
                currentFields[fieldIndex] = {
                    ...currentFields[fieldIndex],
                    configValue: String(newValue)
                };
                modelsMapRef.current = {
                    ...modelsMapRef.current,
                    [modelCode]: currentFields
                };
                pendingModelsRef.current.add(modelCode);
                setModelsMap(modelsMapRef.current);
            };

            const flushModel = (modelCode) => {
                const currentFields = modelsMapRef.current[modelCode] || [];
                if (!window.HOOK || !window.HOOK.setModel || currentFields.length === 0) return;
                const savePayload = {};
                currentFields.forEach(field => {
                    savePayload[field.code] = { configValue: field.configValue };
                });
                window.HOOK.setModel(modelCode, JSON.stringify(savePayload));
                pendingModelsRef.current.delete(modelCode);
            };

            const flushAll = () => {
                Array.from(pendingModelsRef.current).forEach(flushModel);
                return true;
            };

            useEffect(() => {
                window.handleData = flushAll;
                return () => {
                    if (window.handleData === flushAll) delete window.handleData;
                };
            }, []);

            // --- 列表弹窗逻辑 (关键修改部分) ---

            const openListSheet = (modelCode, fieldItem) => {
                const { code, name, type, desc, configValue } = fieldItem;

                // 1. 先获取原始数据
                let listData = getFieldData(modelCode, code);

                // 2. 解析当前已选中的 ID，用于排序
                const newSelectedIds = new Set();
                const newSelectedCounts = {};
                try {
                    const parsed = JSON.parse(configValue);
                    if (type === 'SELECT') {
                        if (Array.isArray(parsed)) parsed.forEach(id => newSelectedIds.add(id));
                    } else if (type === 'SELECT_AND_COUNT') {
                        if (parsed && typeof parsed === 'object') {
                            Object.entries(parsed).forEach(([id, count]) => {
                                newSelectedIds.add(id);
                                newSelectedCounts[id] = count;
                            });
                        }
                    }
                } catch (e) { console.error("Parse config value failed", e); }

                // 3. 执行排序：已选中的排在最前面 (只执行一次)
                // sort 会改变原数组，这里直接操作 listData 即可
                listData.sort((a, b) => {
                    const isA = newSelectedIds.has(a.id);
                    const isB = newSelectedIds.has(b.id);
                    if (isA && !isB) return -1; // a 在前
                    if (!isA && isB) return 1;  // b 在前
                    return 0; // 保持原顺序
                });

                // 4. 将排好序的数据设置到 State
                setSheetList(listData);
                setSheetConfig({ modelCode, fieldCode: code, type, title: name, desc: desc });
                setSheetSearch('');
                selectedIdsRef.current = newSelectedIds;
                selectedCountsRef.current = newSelectedCounts;
                setSelectedIds(newSelectedIds);
                setSelectedCounts(newSelectedCounts);
                setSheetTagFilters(new Set());
                const selectedSpec = {
                    selectionScope: 'EXPLICIT',
                    includeUserIds: Array.from(newSelectedIds),
                    includeGroupIds: [],
                    excludeUserIds: [],
                    excludeGroupIds: [],
                    relationFilter: 'ALL_KNOWN',
                    capabilityFilter: null
                };
                setSelectedFriendPreview(previewFriendScope(selectedSpec));
                setAllFriendPreview(previewFriendScope({
                    ...selectedSpec,
                    selectionScope: 'ALL_FRIENDS',
                    includeUserIds: []
                }));
                setSheetVisible(true);
            };

            const saveSheet = () => {
                const { modelCode, fieldCode, type } = sheetConfig;
                let newValueStr = "";
                if (type === 'SELECT') {
                    const arr = Array.from(selectedIdsRef.current);
                    newValueStr = JSON.stringify(arr);
                } else {
                    const obj = {};
                    selectedIdsRef.current.forEach(id => {
                        const counts = selectedCountsRef.current;
                        obj[id] = counts[id] !== undefined ? counts[id] : 0;
                    });
                    newValueStr = JSON.stringify(obj);
                }
                handleFieldChange(modelCode, fieldCode, newValueStr);
                flushModel(modelCode);
                setSheetVisible(false);
                Toast.success("已保存列表设置");
            };

            const toggleItem = (id, checked) => {
                const newIds = new Set(selectedIdsRef.current);
                if (checked) {
                    newIds.add(id);
                    if (sheetConfig.type === 'SELECT_AND_COUNT' && selectedCountsRef.current[id] === undefined) {
                        selectedCountsRef.current = {
                            ...selectedCountsRef.current,
                            [id]: 1
                        };
                        setSelectedCounts(selectedCountsRef.current);
                    }
                } else {
                    newIds.delete(id);
                }
                selectedIdsRef.current = newIds;
                setSelectedIds(newIds);
            };

            const handleCountChange = (id, val) => {
                selectedCountsRef.current = {
                    ...selectedCountsRef.current,
                    [id]: val
                };
                setSelectedCounts(selectedCountsRef.current);
            };

            const toggleAll = () => {
                const filteredList = filterSheetItems();
                const allSelected = filteredList.length > 0 &&
                    filteredList.every(item => selectedIdsRef.current.has(item.id));
                const newIds = new Set(selectedIdsRef.current);
                filteredList.forEach(item => {
                    if (allSelected) {
                        newIds.delete(item.id);
                    } else {
                        newIds.add(item.id);
                        if (sheetConfig.type === 'SELECT_AND_COUNT' && selectedCountsRef.current[item.id] === undefined) {
                            selectedCountsRef.current = {
                                ...selectedCountsRef.current,
                                [item.id]: 1
                            };
                        }
                    }
                });
                selectedIdsRef.current = newIds;
                setSelectedIds(newIds);
                setSelectedCounts(selectedCountsRef.current);
            };

            const filterSheetItems = () => {
                const keyword = sheetSearch.trim().toLowerCase();
                return sheetList.filter(item => {
                    const tags = Array.isArray(item.tags) ? item.tags : [];
                    const matchesSearch = keyword.length === 0 ||
                        String(item.name || '').toLowerCase().includes(keyword) ||
                        String(item.id || '').toLowerCase().includes(keyword) ||
                        tags.some(tag => String(tag).toLowerCase().includes(keyword));
                    const matchesTags = sheetTagFilters.size === 0 ||
                        Array.from(sheetTagFilters).every(tag => tags.includes(tag));
                    return matchesSearch && matchesTags;
                });
            };

            const toggleTagFilter = (tag) => {
                const next = new Set(sheetTagFilters);
                if (next.has(tag)) next.delete(tag); else next.add(tag);
                setSheetTagFilters(next);
            };

            // 渲染过滤后的列表
            const renderSheetList = () => {
                const filtered = filterSheetItems();

                if (filtered.length === 0) return <div style={{ padding: 20, textAlign: 'center', color: '#999' }}>无数据</div>;

                return filtered.map(item => {
                    const isChecked = selectedIds.has(item.id);
                    const tags = Array.isArray(item.tags) ? item.tags : [];
                    return (
                        <div key={item.id} className="list-item">
                            <div className="list-item-left" onClick={() => toggleItem(item.id, !isChecked)}>
                                <Checkbox checked={isChecked} style={{ pointerEvents: 'none' }} />
                                <div className="list-item-text">
                                    <div className="list-item-name">{item.name}</div>
                                    {tags.length > 0 && (
                                        <div className="list-item-tags">
                                            {tags.map(tag => <span className="safe-tag" key={tag}>{tag}</span>)}
                                        </div>
                                    )}
                                </div>
                            </div>
                            {sheetConfig.type === 'SELECT_AND_COUNT' && isChecked && (
                                <InputNumber
                                    className="list-count-input"
                                    size="small"
                                    min={0}
                                    value={selectedCounts[item.id] ?? 0}
                                    onChange={(v) => handleCountChange(item.id, v)}
                                    placeholder="数量"
                                />
                            )}
                        </div>
                    );
                });
            };

            useEffect(() => {
                if (!sheetVisible) return;
                setSelectedFriendPreview(previewFriendScope({
                    selectionScope: 'EXPLICIT',
                    includeUserIds: Array.from(selectedIds),
                    includeGroupIds: [],
                    excludeUserIds: [],
                    excludeGroupIds: [],
                    relationFilter: 'ALL_KNOWN',
                    capabilityFilter: null
                }));
            }, [selectedIds, sheetVisible]);

            const openTimeSheet = (modelCode, fieldItem) => {
                const disabled = fieldItem.configValue === '-1';
                const values = disabled
                    ? []
                    : String(fieldItem.configValue || '')
                        .split(',')
                        .map(value => value.trim())
                        .filter(Boolean);
                const config = {
                    modelCode,
                    fieldCode: fieldItem.code,
                    editorType: fieldItem.editorType,
                    title: fieldItem.name,
                    defaultConfigValue: fieldItem.defaultConfigValue || ''
                };
                timeValuesRef.current = values;
                timeDisabledRef.current = disabled;
                setTimeSheetConfig(config);
                setTimeValues(values);
                setTimeDisabled(disabled);
                setTimeSheetVisible(true);
            };

            const setTimeValue = (index, value) => {
                const next = [...timeValuesRef.current];
                next[index] = value.replace(/[^\d-]/g, '').slice(0, 9);
                timeValuesRef.current = next;
                setTimeValues(next);
            };

            const removeTimeValue = (index) => {
                const next = timeValuesRef.current.filter((_, itemIndex) => itemIndex !== index);
                timeValuesRef.current = next;
                setTimeValues(next);
            };

            const addTimeValue = () => {
                const fallback = timeSheetConfig.editorType === 'TIME_RANGES'
                    ? '0000-0000'
                    : '0000';
                const next = [...timeValuesRef.current, fallback];
                timeValuesRef.current = next;
                setTimeValues(next);
            };

            const isValidClock = (value) => {
                if (!/^\d{4}$/.test(value)) return false;
                const hour = Number(value.slice(0, 2));
                const minute = Number(value.slice(2));
                return hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59;
            };

            const isValidTimeValue = (value) => {
                if (timeSheetConfig.editorType === 'TIME_POINTS') {
                    return isValidClock(value);
                }
                const parts = value.split('-');
                return parts.length === 2 &&
                    isValidClock(parts[0]) &&
                    isValidClock(parts[1]);
            };

            const saveTimeSheet = () => {
                const {
                    modelCode,
                    fieldCode
                } = timeSheetConfig;
                let configValue = '-1';
                if (!timeDisabledRef.current) {
                    const values = timeValuesRef.current
                        .map(value => value.trim())
                        .filter(Boolean);
                    if (values.length === 0 || !values.every(isValidTimeValue)) {
                        Toast.error('时间格式无效');
                        return;
                    }
                    configValue = Array.from(new Set(values)).join(',');
                }
                handleFieldChange(modelCode, fieldCode, configValue);
                flushModel(modelCode);
                setTimeSheetVisible(false);
                Toast.success('已保存时间设置');
            };

            const resetTimeSheet = () => {
                const values = String(timeSheetConfig.defaultConfigValue || '')
                    .split(',')
                    .map(value => value.trim())
                    .filter(value => value && value !== '-1');
                timeValuesRef.current = values;
                timeDisabledRef.current = false;
                setTimeValues(values);
                setTimeDisabled(false);
            };

            const toggleTimeDisabled = (disabled) => {
                timeDisabledRef.current = disabled;
                setTimeDisabled(disabled);
            };

            // --- 渲染主界面配置项 ---
            const renderFieldItem = (modelCode, item) => {
                const { type, name, code, configValue, desc, expandKey, editorType } = item;
                if (type === 'BOOLEAN') {
                    return (
                        <div className="field-row" key={code}>
                            <div className="field-label">{name}</div>
                            <div className="field-control">
                                <Switch checked={configValue === 'true'} onChange={(v) => handleFieldChange(modelCode, code, v)} />
                            </div>
                        </div>
                    );
                }
                if (['TIME_POINTS', 'TIME_RANGES'].includes(editorType)) {
                    const count = configValue === '-1'
                        ? 0
                        : String(configValue || '').split(',').filter(Boolean).length;
                    return (
                        <div className="field-row" key={code}>
                            <div className="field-label">{name}</div>
                            <div className="field-control">
                                <Button
                                    theme="solid"
                                    type="secondary"
                                    onClick={() => openTimeSheet(modelCode, item)}
                                >
                                    {configValue === '-1' ? '已关闭' : `${count} 个时段`}
                                </Button>
                            </div>
                        </div>
                    );
                }
                if (['MULTIPLY_INTEGER', 'INTEGER', 'STRING', 'TEXT', 'LIST'].includes(type)) {
                    return (
                        <div className="field-row" key={code}>
                            <div className="field-label">{name}</div>
                            <div className="field-control" style={{ width: '50%' }}>
                                <Input value={configValue} onChange={(v) => handleFieldChange(modelCode, code, v)} placeholder="请输入..." />
                            </div>
                        </div>
                    );
                }
                if (type === 'URL_TEXT') {
                    return (
                        <div className="field-row" key={code}>
                            <Text link={{ href: configValue }}>{name}</Text>
                        </div>
                    );
                }
                if (type === 'CHOICE') {
                    return (
                        <div style={{ padding: '12px 0', borderBottom: '1px solid var(--semi-color-border)' }} key={code}>
                            <div style={{ marginBottom: 8, fontWeight: 600, fontSize: 14, color: 'var(--semi-color-text-0)' }}>{name}</div>
                            <RadioGroup type="button" value={Number(configValue)} onChange={(e) => handleFieldChange(modelCode, code, e.target.value)}>
                                {expandKey && expandKey.map((label, idx) => (<Radio value={idx} key={idx}>{label}</Radio>))}
                            </RadioGroup>
                        </div>
                    );
                }
                if (['SELECT', 'SELECT_AND_COUNT'].includes(type)) {
                    let count = 0;
                    try {
                        const parsed = JSON.parse(configValue);
                        count = Array.isArray(parsed) ? parsed.length : Object.keys(parsed).length;
                    } catch (e) { }
                    return (
                        <div className="field-row" key={code}>
                            <div className="field-label">{name}</div>
                            <div className="field-control">
                                <Button theme='solid' type='secondary' onClick={() => openListSheet(modelCode, item)}>
                                    已选 {count} 项
                                </Button>
                            </div>
                        </div>
                    )
                }
                return null;
            };

            return (
                <div className="container">
                    <div className="header">
                        <Title heading={2} style={{ margin: 0 }}>Sesame-VN 设置</Title>
                        <Button style={{}} onClick={switchMode} > 切换主题 </Button>
                    </div>

                    <div className="section-padding">
                        <Collapse
                            accordion
                            defaultActiveKey={tabs[0]?.modelCode}
                            onChange={flushAll}
                        >
                            {tabs.map((tab) => (
                                <Collapse.Panel
                                    header={<div style={{ fontWeight: 600 }}>{tab.modelName}</div>}
                                    itemKey={tab.modelCode}
                                    key={tab.modelCode}
                                >
                                    <div>
                                        {modelsMap[tab.modelCode] ? (
                                            modelsMap[tab.modelCode].map(field => renderFieldItem(tab.modelCode, field))
                                        ) : (
                                            <div style={{ padding: 20, textAlign: 'center' }}>加载中...</div>
                                        )}
                                    </div>
                                </Collapse.Panel>
                            ))}
                        </Collapse>
                    </div>

                    <div style={{ padding: 20, textAlign: 'center' }}>
                        <Button
                            theme='solid'
                            type='danger'
                            block
                            onClick={() => {
                                flushAll();
                                if (window.HOOK && window.HOOK.saveOnExit) {
                                    window.HOOK.saveOnExit();
                                } else if (window.Android && window.Android.onExit) {
                                    window.Android.onExit();
                                } else {
                                    console.log("模拟: 保存并退出");
                                }
                            }}
                        >
                            退出并保存
                        </Button>
                        <Text style={{ marginTop: 15, color: '#999', fontSize: 12 }} link={{ href: 'https://github.com/1754164240/Sesame-VN' }}> Github开源地址 </Text>
                        <div style={{ marginTop: 5, color: '#999', fontSize: 14 }}>🥳 Power by <Text link={{ href: 'https://semi.design/' }}>Semi.Design</Text> © 2026-04-11 With <Text link={{ href: 'https://github.com/1754164240' }}>VNyang</Text> </div>
                        <div style={{ marginTop: 5, color: '#999', fontSize: 14 }}>Ver: {window.HOOK.getBuildInfo()}</div>
                    </div>

                    {/* 侧边列表弹窗 */}
                    <SideSheet
                        title={<span style={{ fontSize: 16, fontWeight: 600 }}>{sheetConfig.title}</span>}
                        visible={sheetVisible}
                        onCancel={saveSheet}
                        width="100%"
                        placement="right"
                        bodyStyle={{ padding: 10 }}
                    >
                        <Text>{sheetConfig.desc}</Text>
                        <div style={{ padding: '10px 16px', borderBottom: '1px solid var(--semi-color-border)' }}>
                            <Input
                                prefix={<IconSearch />}
                                placeholder="搜索名称、ID 或标签..."
                                value={sheetSearch}
                                onChange={setSheetSearch}
                            />
                            {Array.from(new Set(sheetList.flatMap(item =>
                                Array.isArray(item.tags) ? item.tags : []
                            ))).length > 0 && (
                                <div className="list-item-tags" style={{ marginTop: 10 }}>
                                    {Array.from(new Set(sheetList.flatMap(item =>
                                        Array.isArray(item.tags) ? item.tags : []
                                    ))).map(tag => (
                                        <Button
                                            size="small"
                                            type={sheetTagFilters.has(tag) ? 'primary' : 'tertiary'}
                                            theme={sheetTagFilters.has(tag) ? 'solid' : 'borderless'}
                                            key={tag}
                                            onClick={() => toggleTagFilter(tag)}
                                        >
                                            {tag}
                                        </Button>
                                    ))}
                                </div>
                            )}
                            <div style={{ marginTop: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <Checkbox onChange={toggleAll} checked={false}>
                                    全选/反选 (当前可见)
                                </Checkbox>
                                <Text size="small" type="secondary">已选: {selectedIds.size}</Text>
                            </div>
                            {(selectedFriendPreview || allFriendPreview) && (
                                <div>
                                    <div className="preview-strip">
                                        <div className="preview-metric">
                                            当前有效<br />{selectedFriendPreview?.effectiveCount ?? 0}
                                        </div>
                                        <div className="preview-metric">
                                            当前失效<br />{selectedFriendPreview?.invalidCount ?? 0}
                                        </div>
                                        <div className="preview-metric">
                                            动态好友<br />{allFriendPreview?.effectiveCount ?? 0}
                                        </div>
                                    </div>
                                    {allFriendPreview?.groups?.length > 0 && (
                                        <div className="list-item-tags">
                                            {allFriendPreview.groups.map(group => (
                                                <span className="safe-tag" key={group.id}>
                                                    {group.name} {group.memberCount}
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        <div style={{ padding: '0 16px', overflowY: 'auto', height: 'calc(100vh - 180px)' }}>
                            {renderSheetList()}
                        </div>
                        <div className="sheet-footer" style={{ padding: '16px', justifyContent: 'space-around', position: 'absolute', bottom: 0, width: '100%', background: 'var(--semi-color-bg-1)' }}>
                            <Button style={{ marginRight: 10 }} onClick={() => setSheetVisible(false)}>放弃更改</Button>
                            <Button theme="solid" onClick={saveSheet}>保存</Button>
                        </div>
                    </SideSheet>

                    <SideSheet
                        title={<span style={{ fontSize: 16, fontWeight: 600 }}>{timeSheetConfig.title}</span>}
                        visible={timeSheetVisible}
                        onCancel={saveTimeSheet}
                        width="100%"
                        placement="right"
                        bodyStyle={{ padding: 16 }}
                    >
                        <div className="field-row">
                            <div className="field-label">启用</div>
                            <Switch
                                checked={!timeDisabled}
                                onChange={(enabled) => toggleTimeDisabled(!enabled)}
                            />
                        </div>
                        {!timeDisabled && timeValues.map((value, index) => {
                            if (timeSheetConfig.editorType === 'TIME_RANGES') {
                                const parts = value.split('-');
                                return (
                                    <div className="time-row" key={index}>
                                        <Input
                                            value={parts[0] || ''}
                                            maxLength={4}
                                            placeholder="HHmm"
                                            onChange={(start) => setTimeValue(
                                                index,
                                                `${start}-${parts[1] || ''}`
                                            )}
                                        />
                                        <span>至</span>
                                        <Input
                                            value={parts[1] || ''}
                                            maxLength={4}
                                            placeholder="HHmm"
                                            onChange={(end) => setTimeValue(
                                                index,
                                                `${parts[0] || ''}-${end}`
                                            )}
                                        />
                                        <Button
                                            type="danger"
                                            theme="borderless"
                                            onClick={() => removeTimeValue(index)}
                                        >
                                            删除
                                        </Button>
                                    </div>
                                );
                            }
                            return (
                                <div className="time-row time-point" key={index}>
                                    <Input
                                        value={value}
                                        maxLength={4}
                                        placeholder="HHmm"
                                        onChange={(next) => setTimeValue(index, next)}
                                    />
                                    <Button
                                        type="danger"
                                        theme="borderless"
                                        onClick={() => removeTimeValue(index)}
                                    >
                                        删除
                                    </Button>
                                </div>
                            );
                        })}
                        {!timeDisabled && (
                            <Button block onClick={addTimeValue}>添加时间</Button>
                        )}
                        <div className="sheet-footer" style={{ marginTop: 16 }}>
                            <Button onClick={resetTimeSheet}>恢复默认</Button>
                            <Button theme="solid" onClick={saveTimeSheet}>保存</Button>
                        </div>
                    </SideSheet>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>

</html>
